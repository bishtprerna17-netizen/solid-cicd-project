<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Advisory Platform</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { background: #1e293b; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h1 { color: #38bdf8; }
        .status { background: #22c55e; color: white; padding: 5px 15px; border-radius: 20px; display: inline-block; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Smart AI Advisory Platform</h1>
        <p>Empowering users with real-time automated insights and predictions.</p>
        <div class="status">Pipeline Status: DevSecOps Secured ✅</div>
    </div>
</body>
</html>
